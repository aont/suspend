name: Deploy GitHub Pages (public)

on:
  push:
    branches: ["main"]
    # Deploy only when changes occur in public/ (skip condition)
    paths:
      - "public/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.final_deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install terser
        run: npm install --no-save terser

      - name: Configure GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v5

      - name: Build bookmarklet and index.html
        run: node scripts/build-bookmarklet.mjs
        env:
          GITHUB_PAGES_URL: ${{ steps.configure_pages.outputs.base_url }}

      # Upload public/ as built as the Pages site artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-final
          path: public

      - name: Deploy to GitHub Pages
        id: final_deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-final
